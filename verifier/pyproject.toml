[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pcp-verifier"
version = "0.1.0"
description = "Proof-Carrying Patch verifier: proof runner, checkers, verdict, server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "unidiff>=0.7.5",
  "sse-starlette>=2.1",
  "jsonschema>=4.23",
  "pytest>=8",          # the proof runner drives pytest in the target repo
]

[project.optional-dependencies]
dev = ["pytest-asyncio>=0.24", "ruff>=0.6", "coverage>=7"]

[project.scripts]
pcp-verifier = "pcp_verifier.server:main"
pcp-bench = "pcp_verifier.bench:main"

[tool.setuptools.packages.find]
include = ["pcp_verifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
